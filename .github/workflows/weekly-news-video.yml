name: Weekly News Video

# Sunday 02:00 UTC = 03:00 BST. Render/host/YouTube (~25 min) run straight
# through on schedule. Instagram distribution is NOT in this workflow — it's
# a separate Zapier routine (trig_01FAsewZuz6dWt3nq7iCKAdw, Mondays 08:00 UTC)
# that reads the digests/latest.json manifest this workflow hosts below and
# publishes the Reel through Zapier's own Instagram connection. Verified
# working end-to-end 22 Sep 2026 (see project_video_pipeline.md).
# REMOVED 22 Sep 2026: an in-workflow `publish-instagram` job gated behind a
# GitHub environment approval that nobody was ever going to approve now the
# Zapier routine does the job — it sat in `waiting` indefinitely and, because
# of the concurrency group below, deadlocked every subsequent run behind it.
# Still manual: pasting the block the upload step prints into
# news-blkout/src/config/aivorDigest.ts so the news site panel tracks it.

on:
  schedule:
    - cron: "0 2 * * 0"
    # Second and third chances the same Sunday (27 Oct 2026). Four editions (23 Aug, 6 Sep,
    # 27 Sep, 25 Oct) were lost because GitHub's runner briefly could not connect to
    # news.blkoutuk.com while the site was fine. A later run goes ahead only if this week's
    # digest is not already recorded (the "already-done" job below), so it never makes two.
    - cron: "0 11 * * 0"
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      week_label:
        description: "ISO week tag override (e.g. 2026-W18). Empty = current."
        required: false
        type: string
      privacy:
        description: "YouTube privacy"
        required: false
        type: choice
        default: unlisted
        options: [unlisted, public, private]
      skip_curator:
        description: "Skip news curation (use existing props/weekly-*.json)"
        required: false
        type: boolean
        default: false
      skip_lipsync:
        description: "Skip lipsync (use existing aivor-news-*-talking.mp4)"
        required: false
        type: boolean
        default: false
      skip_upload:
        description: "Skip YouTube upload"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-news-video
  cancel-in-progress: false

jobs:
  already-done:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          # Manual runs always go ahead. A scheduled run skips if this ISO week's digest exists.
          if [ "$EVENT" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          WEEK=$(date -u +%G-W%V)
          N=$(curl -fsS "${SUPABASE_URL%/}/rest/v1/aivor_digests?select=week_tag&week_tag=eq.${WEEK}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" | grep -c week_tag || true)
          if [ "$N" -gt 0 ]; then echo "Digest ${WEEK} already recorded: this run is not needed."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "No digest for ${WEEK} yet: running."; echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  render-and-upload:
    needs: already-done
    if: needs.already-done.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: remotion-videos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-videos/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run weekly pipeline (curate → lipsync → render)
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CHATTERBOX_URL: ${{ secrets.CHATTERBOX_URL }}
          AIVOR_VOICE_REFERENCE: ${{ secrets.AIVOR_VOICE_REFERENCE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          BLKOUT_PLATFORM_ENV: /dev/null
          WEEK_LABEL: ${{ inputs.week_label }}
          SKIP_CURATOR: ${{ inputs.skip_curator }}
          SKIP_LIPSYNC: ${{ inputs.skip_lipsync }}
        run: |
          set -e
          ARGS=(--aspects 9x16)
          [ -n "$WEEK_LABEL" ] && ARGS+=(--week-label "$WEEK_LABEL")
          [ "$SKIP_CURATOR" = "true" ] && ARGS+=(--skip-curator)
          [ "$SKIP_LIPSYNC"  = "true" ] && ARGS+=(--skip-lipsync)
          node scripts/weekly-render.mjs "${ARGS[@]}"

      - name: Upload mp4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-news-video-${{ github.run_number }}
          path: |
            remotion-videos/out/weekly-*-9x16.mp4
            remotion-videos/out/weekly-*-script.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to YouTube
        if: ${{ !inputs.skip_upload }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Needed to write the digest row that the news site panel reads.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # inputs.privacy only exists on workflow_dispatch; on a `schedule`
          # trigger it is always empty. This fallback IS the weekly default.
          # 31 Oct 2026: unlisted again, now that Rob signs off on Telegram and
          # publish-news-video.yml makes it public (it no longer publishes to nobody).
          YT_PRIVACY: ${{ inputs.privacy || 'unlisted' }}
          WEEK_LABEL: ${{ inputs.week_label }}
        run: |
          set -e
          ARGS=(--aspect 9x16 --privacy "$YT_PRIVACY")
          [ -n "$WEEK_LABEL" ] && ARGS+=(--week-label "$WEEK_LABEL")
          node scripts/upload-youtube.mjs "${ARGS[@]}"

      # Host the digest (video + caption manifest) at stable public URLs so the
      # Monday distribution routine can publish the Instagram Reel through
      # Zapier's own connection — no Meta credential needed in this repo. The
      # routine reads digests/latest.json and refuses manifests older than 8
      # days, so a failure here surfaces Monday as NO-REPORT, never a stale post.
      - name: Host digest for distribution
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          WEEK_LABEL: ${{ inputs.week_label }}
        run: |
          set -e
          ARGS=(--aspect 9x16)
          [ -n "$WEEK_LABEL" ] && ARGS+=(--week-label "$WEEK_LABEL")
          node scripts/host-digest.mjs "${ARGS[@]}"

      # 31 Oct 2026 (Rob: "full What's On flow for the news digest too"): ask Rob to approve on
      # Telegram. The content register row is written when it goes public (publish-news-video.yml),
      # no longer here, because an unapproved digest has not been posted.
      - name: Ask Rob to approve on Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPROVALS_BOT_TOKEN: ${{ secrets.APPROVALS_BOT_TOKEN }}
          WEEK_LABEL: ${{ inputs.week_label }}
        run: |
          set -e
          # Same week rule as upload-youtube.mjs and host-digest.mjs: the ISO week of today.
          WEEK="${WEEK_LABEL:-$(date -u +%G-W%V)}"
          node scripts/events-video.mjs request --kind news --week-label "$WEEK"

      - name: Failure summary
        if: failure()
        run: |
          echo "::error::Weekly news video pipeline failed."
          echo "Inspect the artifact for partial outputs."

      # A failed Sunday used to be found days later in the Actions log: the 6 Sep 2026 run
      # died in the curator and nobody was told. This step tells Rob within a minute, and it
      # fails loudly itself if the secrets are missing — a silent notifier is the same fault.
      - name: Tell Rob on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID missing — nobody was told about this failure."
            exit 1
          fi
          MSG="Weekly news video FAILED — $(date -u '+%a %d %b %H:%M') UTC. No digest this week unless re-run. $RUN_URL"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "telegram sent"
