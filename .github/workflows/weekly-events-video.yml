name: Weekly Events Video

# AIvor events digest, "BLKOUT What's On" (spec:
# ~/blkout/projects/aivor-media/docs/events-digest-spec-2026-10-24.md).
# Thursdays 10:00 UK: render from gatherings_live, upload to YouTube UNLISTED, record it in
# aivor_event_digests and send it to Rob on Telegram with a signed approve link
# (scripts/events-video.mjs). Nothing goes public here: publish-events-video.yml does that
# from 18:00, and only once Rob has approved (Rob, 26 Oct 2026). No Zapier, no Instagram yet.
# A manual run is review-only (artifact) unless send_for_signoff is ticked.

on:
  schedule:
    # 10:00 UTC = 10:00 GMT. During BST (from 28 Mar 2027) this is 11:00; move to 09:00 then.
    - cron: "0 10 * * 4"
  workflow_dispatch:
    inputs:
      send_for_signoff:
        description: "Upload unlisted and send to Rob on Telegram (otherwise review artifact only)"
        required: false
        type: boolean
        default: false
      skip_lipsync:
        description: "Skip lipsync (layout check only, still avatar)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Its own group: the news digest runs Sundays on a separate runner, so the two
# never share a machine. One events render at a time.
concurrency:
  group: weekly-events-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: remotion-videos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-videos/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Curate → lipsync → render (9:16)
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CHATTERBOX_URL: ${{ secrets.CHATTERBOX_URL }}
          AIVOR_VOICE_REFERENCE: ${{ secrets.AIVOR_VOICE_REFERENCE_URL }}
          # Slower, less hurried delivery (Rob, 26 Oct: "as if it's on the clock"). Lower
          # cfg_weight slows the pace; the server default is 0.5.
          AIVOR_TTS_CFG: "0.3"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          BLKOUT_PLATFORM_ENV: /dev/null
          SKIP_LIPSYNC: ${{ inputs.skip_lipsync }}
        run: |
          set -e
          ARGS=(--property events --aspects 9x16)
          [ "$SKIP_LIPSYNC" = "true" ] && ARGS+=(--skip-lipsync)
          node scripts/weekly-render.mjs "${ARGS[@]}"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-video-review-${{ github.run_number }}
          path: |
            remotion-videos/out/events-*-9x16.mp4
            remotion-videos/out/events-*-script.txt
            remotion-videos/props/events-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload unlisted and send to Rob for sign-off
        if: ${{ github.event_name == 'schedule' || inputs.send_for_signoff }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/events-video.mjs upload

      # A failed Thursday must reach Rob the same morning, not be found in the Actions log.
      - name: Tell Rob on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID missing — nobody was told about this failure."
            exit 1
          fi
          MSG="BLKOUT What's On video FAILED — $(date -u '+%a %d %b %H:%M') UTC. No events video this week unless re-run. $RUN_URL"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "telegram sent"
